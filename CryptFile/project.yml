# CryptFile — XcodeGen spec → CryptFile.xcodeproj (a macOS 13 App bundle).
#
# The app depends on the in-tree PKCryptEngine SwiftPM package (../PKCryptEngine);
# that package's own linkerSettings.unsafeFlags(["/opt/homebrew/lib/libsodium.a"])
# carries the statically-linked libsodium archive into the final app binary
# (Phase-1 D-02 — no separate dylib signature, no disable-library-validation).
name: CryptFile
options:
  bundleIdPrefix: com.pkcrypt
  deploymentTarget:
    macOS: "13.0"
packages:
  PKCryptEngine:
    path: ../PKCryptEngine
targets:
  CryptFile:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: PKCryptEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pkcrypt.CryptFile
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CryptFile.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CryptFile
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    entitlements:
      path: CryptFile.entitlements
      properties:
        # Exactly the three sandbox entitlements audited in FEASIBILITY-VERDICT
        # §2 D-05. NO downloads.read-write, NO disable-library-validation
        # (libsodium is statically linked, not a dylib).
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
  CryptFileTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/CryptFileTests
    dependencies:
      - target: CryptFile          # TEST_HOST: runs in-app, allows @testable import CryptFile
      - package: PKCryptEngine     # import PKCryptEngine directly for engine-wiring tests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CryptFile:
    build:
      targets:
        CryptFile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CryptFileTests
      # The tests run inside the sandboxed app, where python3/ssh-keygen cannot
      # be launched. Generate the throwaway test keys and containers here,
      # outside the sandbox, before the tests start; no key material is
      # committed. The tests read ../.test-fixtures/cryptfile (git-ignored).
      preActions:
        - name: Generate test fixtures
          settingsTarget: CryptFileTests
          script: |
            set -e
            [ -n "${SRCROOT}" ] || exit 1
            FX_ROOT="${SRCROOT}/../.test-fixtures"
            mkdir -p "${FX_ROOT}"
            rm -rf "${FX_ROOT}/cryptfile"
            PYTHONPATH="${SRCROOT}/.." /usr/bin/python3 \
              "${SRCROOT}/../PKCryptEngine/Scripts/make_test_fixtures.py" \
              "${FX_ROOT}/cryptfile" > "${FX_ROOT}/cryptfile.log" 2>&1
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
