[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pkcrypt"
version = "2.1.0"
description = "Encrypt files so only the holder of an Ed25519 SSH private key can decrypt them."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Warren Zajac" },
]
license = { text = "Apache-2.0" }
dependencies = [
    "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pkcrypt = "pkcrypt_lib.cli:main"

[tool.setuptools]
packages = ["pkcrypt_lib"]
